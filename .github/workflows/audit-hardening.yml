name: Audit Hardening

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: audit-hardening-${{ github.ref }}
  cancel-in-progress: true

# FUF-158: the `uv lock --check` freshness gate deliberately does NOT live here
# any more. As a job inside this reusable workflow it ran in parallel with the
# jobs that consume uv.lock, so it could never block them. It is now the
# top-level `lock-freshness` preflight in ci.yml, and this whole workflow is
# gated behind it. Do not re-add a second copy here.
jobs:
  moseph-no-se1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libswe-dev
      - name: Install locked dependencies
        run: |
          python -m pip install pip==26.1.2 uv==0.11.29
          uv sync --frozen --extra dev
      - name: Run SE1-free suite in explicit MOSEPH mode
        env:
          EPHEMERIS_MODE: MOSEPH
        run: |
          unset SE_EPHE_PATH
          uv run pytest -q

  contract-feature-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libswe-dev
      - name: Install locked dependencies
        run: |
          python -m pip install pip==26.1.2 uv==0.11.29
          uv sync --frozen --extra dev
      - name: Default contract excludes gated surfaces
        run: |
          unset FUFIRE_ENABLE_ZWDS FUFIRE_ENABLE_KEY_ISSUANCE
          uv run python - <<'PY'
          from bazi_engine.app import app
          paths = set(app.openapi()["paths"])
          assert "/v1/admin/keys" not in paths
          assert "/v1/calculate/zwds" not in paths
          assert "/v1/metadata/zwds/rulesets/{ruleset_id}" not in paths
          PY
      - name: ZWDS-enabled contract exposes only ZWDS gated surfaces
        env:
          FUFIRE_ENABLE_ZWDS: "1"
          FUFIRE_ENABLE_KEY_ISSUANCE: "0"
        run: |
          uv run python - <<'PY'
          from bazi_engine.app import app
          paths = set(app.openapi()["paths"])
          assert "/v1/calculate/zwds" in paths
          assert "/v1/metadata/zwds/rulesets/{ruleset_id}" in paths
          assert "/v1/admin/keys" not in paths
          PY
      - name: Key-issuance-enabled contract exposes only admin gated surface
        env:
          FUFIRE_ENABLE_ZWDS: "0"
          FUFIRE_ENABLE_KEY_ISSUANCE: "1"
        run: |
          uv run python - <<'PY'
          from bazi_engine.app import app
          paths = set(app.openapi()["paths"])
          assert "/v1/admin/keys" in paths
          assert "/v1/calculate/zwds" not in paths
          assert "/v1/metadata/zwds/rulesets/{ruleset_id}" not in paths
          PY

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: release-please must cover repository default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          text = Path('.github/workflows/release-please.yml').read_text(encoding='utf-8')
          match = re.search(r'(?m)^\s*branches:\s*\[([^\]]+)\]\s*$', text)
          if not match:
              raise SystemExit('release-please branch list not found')
          branches = {x.strip().strip('"\'') for x in match.group(1).split(',') if x.strip()}
          default = os.environ['DEFAULT_BRANCH']
          if default not in branches:
              raise SystemExit(f'default branch {default!r} missing from release-please branches {sorted(branches)!r}')
          PY

  version-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libswe-dev
      - name: Install locked package
        run: |
          python -m pip install pip==26.1.2 uv==0.11.29
          uv sync --frozen
      - name: Require one release identity
        run: |
          uv run python - <<'PY'
          import json, tomllib
          from pathlib import Path
          import bazi_engine
          from bazi_engine.app import app
          values = {
              'pyproject': tomllib.loads(Path('pyproject.toml').read_text())['project']['version'],
              'release_manifest': json.loads(Path('.release-please-manifest.json').read_text())['.'],
              'runtime': bazi_engine.__version__,
              'openapi': app.openapi()['info']['version'],
          }
          print(values)
          if len(set(values.values())) != 1:
              raise SystemExit(f'version identity drift: {values}')
          PY

  security-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libswe-dev
      - name: Install locked dependencies
        run: |
          python -m pip install pip==26.1.2 uv==0.11.29
          uv sync --frozen --extra dev
      - name: Existing production and limiter contracts
        run: uv run pytest -q tests/test_production_profile.py tests/test_rate_limit_coverage.py
      - name: Expensive public/internal surfaces must have an explicit limiter
        run: |
          uv run python - <<'PY'
          from fastapi.routing import APIRoute
          from bazi_engine.app import app
          from bazi_engine.limiter import infra_limiter, limiter

          required = {
              ('GET', '/api'), ('GET', '/v1/api'),
              ('GET', '/health'), ('GET', '/v1/health'),
              ('GET', '/ready'), ('GET', '/v1/ready'),
              ('POST', '/internal/api/webhooks/chart'),
          }

          # A surface counts as limited when EITHER limiter owns it: the shared
          # application limiter, or the memory-only infrastructure-probe limiter
          # that /health and /ready use so a Redis outage stays reportable.
          LIMITERS = (limiter, infra_limiter)

          def limited(route):
              fn = route.endpoint
              key = f'{fn.__module__}.{fn.__qualname__}'
              return any(
                  key in lim._route_limits or key in lim._dynamic_route_limits
                  for lim in LIMITERS
              )

          missing = []
          for route in app.routes:
              if not isinstance(route, APIRoute):
                  continue
              for method in route.methods:
                  if (method, route.path) in required and not limited(route):
                      missing.append(f'{method} {route.path}')
          if missing:
              raise SystemExit('expensive routes without explicit limiter: ' + ', '.join(sorted(missing)))
          PY

  runtime-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libswe-dev
      - name: Install locked dependencies
        run: |
          python -m pip install pip==26.1.2 uv==0.11.29
          uv sync --frozen --extra dev
      - name: Runtime contract, limiter identity and startup guard contracts
        run: |
          uv run pytest -q \
            tests/test_runtime_contract.py \
            tests/test_limiter_identity_privacy.py \
            tests/test_runtime_config_guard.py
      - name: Readback fails closed on an incomplete production profile
        env:
          # Synthetic value. Long enough to satisfy the contract's minimum so the
          # non-zero exit below proves the MISSING production variables, not a
          # rejected pepper — and distinctive enough to be a real leak probe.
          FUFIRE_RL_PEPPER: ci-gate-sentinel-pepper-0a1b2c3d4e5f60718293
          FUFIRE_ENV: production
        run: |
          set +e
          uv run python -m bazi_engine.runtime_contract --readback --json > readback.json
          rc=$?
          set -e
          cat readback.json
          if [ "$rc" -eq 0 ]; then
            echo "readback exited 0 for an incomplete production profile" >&2
            exit 1
          fi
          if grep -q "ci-gate-sentinel-pepper" readback.json; then
            echo "readback leaked the configured pepper value" >&2
            exit 1
          fi
      - name: Readback passes on a complete production profile
        env:
          FUFIRE_RL_PEPPER: ci-gate-sentinel-pepper-0a1b2c3d4e5f60718293
          FUFIRE_ENV: production
          FUFIRE_REQUIRE_API_KEYS: "true"
          FUFIRE_API_KEYS: ci-gate-sentinel-key-9f81c0
          CORS_ALLOWED_ORIGINS: https://bazodiac.space
          FUFIRE_REPLICA_COUNT: "2"
          FUFIRE_REQUIRE_REDIS: "true"
          REDIS_URL: redis://ci.invalid:6379/0
          EPHEMERIS_MODE: SWIEPH
        run: |
          # Canary for the step above: without a complete profile that step would
          # pass even if the readback could never exit 0 at all.
          uv run python -m bazi_engine.runtime_contract --readback --json

  audit-hardening-gate:
    name: audit-hardening-gate
    if: always()
    needs:
      - moseph-no-se1
      - contract-feature-matrix
      - release-config
      - version-identity
      - security-boundary
      - runtime-contract
    runs-on: ubuntu-latest
    steps:
      - name: Require every audit hardening job to succeed
        env:
          MOSEPH: ${{ needs.moseph-no-se1.result }}
          CONTRACT: ${{ needs.contract-feature-matrix.result }}
          RELEASE: ${{ needs.release-config.result }}
          VERSION: ${{ needs.version-identity.result }}
          SECURITY: ${{ needs.security-boundary.result }}
          RUNTIME_CONTRACT: ${{ needs['runtime-contract'].result }}
        run: |
          python - <<'PY'
          import os
          results = {k: os.environ[k] for k in ('MOSEPH','CONTRACT','RELEASE','VERSION','SECURITY','RUNTIME_CONTRACT')}
          failed = {k: v for k, v in results.items() if v != 'success'}
          print(results)
          if failed:
              raise SystemExit(f'audit-hardening-gate blocked: {failed}')
          PY
